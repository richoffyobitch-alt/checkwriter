name: Release

# Builds the installable applications on the operating systems they target.
#
# This exists for two reasons.
#
# A .dmg is created with hdiutil and a macOS code signature is made with the
# macOS security framework. Neither tool exists anywhere but on a Mac, so a
# macOS release simply cannot be produced on any other host — the best a
# Linux box can manage is an unsigned .zip, which Gatekeeper will refuse to
# open without the user stripping the quarantine flag by hand.
#
# The second reason is duller and just as real: release assets are uploaded
# from the runner, which has unrestricted access to uploads.github.com. That
# has been the bottleneck on every previous release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to, e.g. v1.3.0"
        required: true
        type: string
      draft:
        description: "Create the release as a draft"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: macOS (arm64 + Intel)
    # macos-14 and later are Apple Silicon. Intel artifacts are still
    # produced from it: the native database binary is downloaded per
    # architecture rather than compiled, so no Intel host is needed.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install build dependencies
        working-directory: desktop
        run: npm ci

      # An absent secret still defines the environment variable, as an empty
      # string, and electron-builder then treats "" as a path to a
      # certificate and fails with "not a file". So signing configuration is
      # decided here and the two cases are separate steps.
      - name: Determine signing configuration
        id: signing
        env:
          CERT: ${{ secrets.MAC_CERTIFICATE_P12 }}
        run: |
          if [ -n "$CERT" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Developer ID certificate present: the build will be signed."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No certificate. Building unsigned — Gatekeeper will warn on"
            echo "first launch and the app will use notify-only updates."
          fi

      - name: Build macOS application (unsigned)
        if: steps.signing.outputs.signed == 'false'
        working-directory: desktop
        env:
          # Without an explicit false, electron-builder hunts the keychain
          # for any identity and fails confusingly when it finds none.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac

      - name: Build macOS application (signed and notarized)
        if: steps.signing.outputs.signed == 'true'
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          # Notarization is separate from signing and is what actually
          # clears Gatekeeper's first-launch block.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac

      # The point of building on a Mac is that the result can be run on one.
      # This launches the packaged application and then proves three things
      # that no cross-build could: Electron started, the native database
      # module loaded under Electron's ABI, and the local server is serving.
      #
      # "The process is still alive" would not be enough on its own — a fatal
      # error here shows a modal dialog, which also keeps the process alive.
      # So the check is that the app is listening on loopback and answers.
      - name: Smoke-test the packaged app on macOS
        working-directory: desktop
        run: |
          set -euo pipefail
          APP="$PWD/release/mac-arm64/CheckWriter.app"
          echo "Launching $APP"
          open -n "$APP"

          PID=""
          for i in $(seq 1 30); do
            PID=$(pgrep -f "CheckWriter.app/Contents/MacOS/CheckWriter" | head -1 || true)
            [ -n "$PID" ] && break
            sleep 1
          done
          if [ -z "$PID" ]; then
            echo "::error::The packaged app never started a process."
            exit 1
          fi
          echo "Running as pid $PID"

          PORT=""
          for i in $(seq 1 40); do
            PORT=$(lsof -nP -iTCP -sTCP:LISTEN -a -p "$PID" 2>/dev/null \
                   | awk 'NR>1 {split($9,a,":"); print a[length(a)]}' | head -1 || true)
            [ -n "$PORT" ] && break
            sleep 1
          done
          if [ -z "$PORT" ]; then
            echo "::error::The app started but never listened on a port. That is"
            echo "::error::what a failure to load the native database module looks like."
            kill "$PID" 2>/dev/null || true
            exit 1
          fi
          echo "Listening on 127.0.0.1:$PORT"

          CODE=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT/api/health" || echo 000)
          kill "$PID" 2>/dev/null || true
          if [ "$CODE" != "200" ]; then
            echo "::error::/api/health returned $CODE, expected 200."
            exit 1
          fi
          echo "Smoke test passed: app launched, database module loaded, /api/health 200." \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report what was produced
        working-directory: desktop
        run: |
          echo "### macOS artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh release/*.dmg release/*.zip release/latest-mac.yml | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### SHA-256" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          shasum -a 256 release/*.dmg release/*.zip | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Say plainly whether this build can be opened without the
          # Gatekeeper workaround, because it changes the install
          # instructions the user has to give people.
          if codesign -dv --verbose=2 "release/mac-arm64/CheckWriter.app" 2>&1 | grep -q "Authority=Developer ID"; then
            echo "Signed with a Developer ID." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "UNSIGNED — first launch needs Control-click, Open, or xattr -cr." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
            desktop/release/latest-mac.yml
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install build dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Windows installer
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win

      - name: Report what was produced
        working-directory: desktop
        shell: bash
        run: |
          echo "### Windows artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh release/*.exe release/latest.yml | tee -a "$GITHUB_STEP_SUMMARY"
          sha256sum release/*.exe | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest.yml
          if-no-files-found: error

  publish:
    name: Attach to release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect
        run: |
          mkdir -p upload
          find artifacts -type f -exec cp {} upload/ \;
          ls -lh upload

      # latest.yml and latest-mac.yml are the update feeds. Uploading them
      # is what makes an existing installation notice the new version, so a
      # release missing them looks fine and quietly strands every user.
      - name: Attach assets to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          fail_on_unmatched_files: true
          files: upload/*
